<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Isian</title>
</head>
<body>

<form action="terima.html">
	
	<h1>Data Diri</h1>

    <fieldset id="datadiri">
        <label for="nama">Nama</label><br>
        <input type="text" id="nama" name="nama" placeholder="Irene Evania"><br>

        <label for="namax">Nama Panggilan</label><br>
        <input type="text" id="namax" name="namax" placeholder="Mbak Irene"><br>

        <label for="nrp">Nomer Reg Mhs</label><br>
        <input type="text" id="nrp" name="nrp" placeholder="127304303"><br>

        <label for="pwd">Kata Kunci</label><br>
        <input type="password" id="pwd" name="pwd"><br>

        <label for="surel">Alamat Email</label><br>
        <input type="email" id="surel" name="surel" placeholder="evaniairene@22517.com"><br>

        <label for="ultah">Tanggal Lahir</label><br>
        <input type="date" id="ultah" name="ultah"><br>

        <label for="telp">Nomer HP</label><br>
        <input type="tel" id="telp" name="nohp" placeholder="+62 3782730"><br>
    </fieldset>

    <br><br>
    <label for="gender">Jenis Kelamin</label>
    <fieldset id="gender">
        <input type="radio" name="gender" value="L"> Cowok<br>
        <input type="radio" name="gender" value="P"> Cewek<br>
        <input type="radio" name="gender" value="X" checked> Terserah<br>
    </fieldset>

	<label for="kemampuan">Bisa Apa Saja?</label>
	<fieldset id="kemampuan">
		<input type="checkbox" name="pakar" value="PS"> Bisa Photoshop<br>
		<input type="checkbox" name="pakar" value="AI"> Mahir Ai yang Adobe<br>
	</fieldset>

	<br><br>
	<input type="submit" value="Kirim">
</form>



</body>
</html>
